# Fichier de service PostgreSQL, lu par QGIS, QField (via QFieldSync), psql et pgAdmin.
# Les projets QGIS se connectent par nom de service : ni hôte ni mot de passe
# n'est écrit dans les projets, et changer de serveur ne demande qu'une ligne ici.
#
# Emplacement sous Windows : %APPDATA%\postgresql\.pg_service.conf
# ou n'importe où, en déclarant la variable d'environnement PGSERVICEFILE.
#
# Instance de démonstration (scripts/01_base_postgis.py) : connexion locale sans
# mot de passe. En production, retirer la ligne "user" : chaque agent s'identifie
# avec son compte, enregistré dans la base d'authentification chiffrée de QGIS.

[sig_ccst]
host=localhost
port=5433
dbname=sig_ccst
user=sig_admin
sslmode=disable
